<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Projeto GTA</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Bangers&family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap"
        rel="stylesheet">
</head>

<body>
    <p class="nome">Lucia</p>
    <img class="personagem" src="imagens/lucia.png" alt="Lucia">
    <!-- source = ORIGEM(onde ela tá?) -->
    <div class="textos">
        <p class="etiqueta">Selecione o seu Personagem</p>
        <h1>Não é só <br>um Jogo</h1>
        <p class="texto-apoio">Escolha uma lenda de Dev City. <br> Ou tire uma selfie e vire uma.</p>
    </div>

     <div class="menu">
        <img onclick="escolherPersonagem('Lucia', 'imagens/lucia.png', '#ff3cac')" class="avatar" src="imagens/lucia.png">
        <img onclick="escolherPersonagem('Jason', 'imagens/jason.png', '#00b2c9')" class="avatar" src="imagens/jason.png">
        <img onclick="escolherPersonagem('CJ', 'imagens/cj.png', '#7ed37e')" class="avatar" src="imagens/cj.png">
         <label class="voce">📸
            <input type="file" accept="image/*" hidden onchange="lerFoto(this)">
        </label>
    </div>

</body>
